# Microsoft Excel - 软件知识库

name: Microsoft Excel
version: 2021
description: Microsoft Excel 电子表格软件

# 操作定义
operations:
  - name: 筛选数据
    description: 对指定列进行数据筛选
    steps:
      - action: select_column
        description: 选中目标列
      - action: click_menu
        path: ["数据", "筛选"]
    shortcuts:
      - Ctrl+Shift+L
    verification:
      - 检查列标题出现筛选图标
  
  - name: 保存文件
    description: 保存当前工作簿
    steps:
      - action: hotkey
        keys: ["ctrl", "s"]
    shortcuts:
      - Ctrl+S
  
  - name: 另存为
    description: 另存为新文件
    steps:
      - action: hotkey
        keys: ["ctrl", "shift", "s"]
      - action: type
        element: 文件名
    shortcuts:
      - Ctrl+Shift+S
  
  - name: 查找
    description: 查找内容
    steps:
      - action: hotkey
        keys: ["ctrl", "f"]
    shortcuts:
      - Ctrl+F
  
  - name: 替换
    description: 替换内容
    steps:
      - action: hotkey
        keys: ["ctrl", "h"]
      - action: type
        element: 查找内容
      - action: type
        element: 替换为
      - action: click
        target: 全部替换
    shortcuts:
      - Ctrl+H

# 快捷键映射
shortcuts:
  新建: ["ctrl", "n"]
  打开: ["ctrl", "o"]
  保存: ["ctrl", "s"]
  另存为: ["ctrl", "shift", "s"]
  撤销: ["ctrl", "z"]
  重做: ["ctrl", "y"]
  复制: ["ctrl", "c"]
  粘贴: ["ctrl", "v"]
  剪切: ["ctrl", "x"]
  全选: ["ctrl", "a"]
  查找: ["ctrl", "f"]
  替换: ["ctrl", "h"]
  筛选: ["ctrl", "shift", "l"]
  插入行: ["ctrl", "shift", "+"]
  删除行: ["ctrl", "-"]
  加粗: ["ctrl", "b"]
  斜体: ["ctrl", "i"]
  下划线: ["ctrl", "u"]

# UI元素定位提示
ui_hints:
  ribbon_tabs: ["文件", "开始", "插入", "页面布局", "公式", "数据", "审阅", "视图"]
  common_buttons:
    确定: ["确定", "OK", "确认"]
    取消: ["取消", "Cancel", "关闭"]
    保存: ["保存", "Save"]
